<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>パンダ俳句 β</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #f6f6f6;
      margin: 0;
      padding: 2rem;
    }
    .card {
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 1.2rem;
    }
    .haiku {
      margin: 2rem 0;
      line-height: 2;
      font-size: 1.2rem;
      color: #333;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: .6rem 1.4rem;
      font-size: 1rem;
      background: #222;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      opacity: .85;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>パンダ俳句 β</h1>

    <div class="haiku">
      <div id="first">（初句）</div>
      <div id="middle">（中句）</div>
      <div id="last">（結句）</div>
    </div>

    <button onclick="generate()">選ぶ</button>
  </div>

  <script>
    const trad = {
      spring: ["春雷や", "若葉揺れ", "花の雨"],
      summer: ["夏雲や", "蝉しぐれ", "川光る"],
      autumn: ["秋風や", "虫の声", "月高し"],
      winter: ["初霜や", "雪しんしん", "冬の星"]
    };

    const modern = {
      spring: ["改札で", "画面越し", "通知鳴る"],
      summer: ["冷房の", "ガラス越し", "白い午後"],
      autumn: ["終電で", "無人駅", "イヤホン外す"],
      winter: ["深夜便", "白い壁", "息白し"]
    };

    const ends = {
      spring: ["まだ遠い", "揺れている", "黙ってる"],
      summer: ["少し待つ", "目を閉じる", "風が来る"],
      autumn: ["何も言わず", "そのままで", "歩き出す"],
      winter: ["朝になる", "音もなく", "消えてゆく"]
    };

    function pick(obj) {
      const keys = Object.keys(obj);
      const k = keys[Math.floor(Math.random() * keys.length)];
      const arr = obj[k];
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function generate() {
      document.getElementById("first").textContent  = pick(trad);
      document.getElementById("middle").textContent = pick(modern);
      document.getElementById("last").textContent   = pick(ends);
    }

    generate();
  </script>
</body>
</html>
