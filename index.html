<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パンダ俳句 β - AI Sensei</title>
    <style>
        :root { --primary: #111; --bg: #fdfdfd; --accent: #79C83D; }
        body { margin: 0; font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif; background: var(--bg); color: #111; }
        .wrapper { max-width: 480px; margin: 0 auto; padding: 15px; box-sizing: border-box; min-height: 100vh; display: block; }
        .card { background: #fff; border-radius: 28px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,.06); border: 1px solid #f0f0f0; }
        
        /* Language Tabs */
        .lang-nav { display: flex; gap: 8px; margin-bottom: 15px; justify-content: center; }
        .lang-btn { cursor: pointer; border: 1px solid #eee; background: #fff; padding: 6px 12px; border-radius: 20px; font-size: 11px; color: #999; }
        .lang-btn.active { background: var(--primary); color: #fff; }

        /* Panda Top Section */
        .top { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; position: relative; }
        .panda { width: 60px; height: 60px; object-fit: contain; cursor: pointer; }
        .logo-text { font-size: 1.1rem; font-weight: bold; }
        
        /* Speech Bubble */
        .bubble { 
            position: absolute; background: #333; color: #fff; padding: 5px 10px; border-radius: 10px; 
            font-size: 10px; top: -10px; left: 50px; opacity: 0; transition: 0.3s; pointer-events: none;
        }
        .bubble.show { opacity: 1; top: -20px; }

        /* Haiku Display */
        .haiku-display { text-align: center; margin: 20px 0; min-height: 200px; display: flex; justify-content: center; align-items: center; gap: 15px; border-radius: 20px; background: #fafafa; border: 1px dashed #eee; overflow: hidden; }
        .display-ja { writing-mode: vertical-rl; height: 160px; font-family: serif; font-size: 24px; letter-spacing: 0.2em; }
        .display-eu { display: flex; flex-direction: column; font-style: italic; font-size: 20px; line-height: 1.6; }
        .line { min-height: 1.2em; }
        .dim { color: #ddd; }
        
        /* Control Stages */
        .controls { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .section-title { font-size: 0.75rem; font-weight: bold; color: #aaa; text-align: center; margin-bottom: 5px; }
        
        .opt { display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; border-radius: 12px; padding: 12px; background: #fff; width: 100%; font-size: 14px; }
        .opt:hover { border-color: var(--accent); }
        .opt strong { font-size: 9px; background: #f0f0f0; padding: 2px 5px; border-radius: 4px; }
        
        .primary { background: var(--primary); color: #fff; border: none; border-radius: 12px; padding: 15px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; }
        input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 12px; font-size: 16px; box-sizing: border-box; text-align: center; }

        /* Result */
        .score-screen { text-align: center; padding: 10px 0; }
        .score-val { font-size: 40px; font-weight: bold; color: var(--accent); }
        .critique-text { font-style: italic; color: #555; font-size: 14px; margin: 10px 0; }

        /* History Gallery */
        .history-section { margin-top: 30px; border-top: 1px solid #f0f0f0; padding-top: 15px; }
        .gallery { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; }
        .hcard { writing-mode: vertical-rl; text-orientation: upright; font-family: serif; font-size: 14px; padding: 12px; border: 1px solid #eee; border-radius: 12px; background: #fff; min-width: 100px; height: 140px; position: relative; flex-shrink: 0; }
        .delete-btn { position: absolute; bottom: 2px; left: 2px; font-size: 9px; color: #ff5555; border: none; background: none; writing-mode: horizontal-tb; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="lang-nav">
        <button id="l-ja" class="lang-btn active" onclick="setLang('ja')">日本語</button>
        <button id="l-fr" class="lang-btn" onclick="setLang('fr')">français</button>
        <button id="l-en" class="lang-btn" onclick="setLang('en')">english</button>
    </div>

    <div class="card">
        <div class="top">
            <div id="pandaTalk" class="bubble">...</div>
            <img class="panda" id="pandaImg" src="https://45jp.net/wp-content/uploads/2020/05/warau_panda.png" alt="Panda" onclick="reactPanda()">
            <div>
                <span class="logo-text" id="ui-title">パンダ俳句 β</span><br>
                <select id="seasonSelect" onchange="start()" style="font-size: 11px; border: 1px solid #eee; border-radius: 5px;">
                    <option value="spring">春</option>
                    <option value="summer">夏</option>
                    <option value="autumn">秋</option>
                    <option value="winter">冬</option>
                </select>
            </div>
        </div>

        <div id="displayArea" class="haiku-display"></div>

        <div id="stage1" class="controls">
            <span class="section-title" id="ui-t1">季語を選ぶ</span>
            <div id="opts1"></div>
        </div>

        <div id="stage2" class="controls hidden">
            <span class="section-title" id="ui-t2">中句を詠む</span>
            <input type="text" id="inputMiddle" placeholder="...">
            <button class="primary" onclick="toStage3()" id="ui-next">次へ</button>
        </div>

        <div id="stage3" class="controls hidden">
            <span class="section-title" id="ui-t3">結びを選ぶ</span>
            <div id="opts3"></div>
            <hr style="border:0; border-top:1px solid #eee; margin:10px 0; width:100%;">
            <input type="text" id="inputLast" placeholder="...">
            <button class="primary" onclick="finishHaiku()" id="ui-done">決定</button>
        </div>

        <div id="stage4" class="score-screen hidden">
            <span class="section-title">AIパンダ先生の採点</span>
            <div class="score-val" id="resScore">0</div>
            <p class="critique-text" id="resCrit">...</p>
            <button class="primary" onclick="saveAndReset()">保存して次へ</button>
        </div>

        <div class="history-section">
            <h4 id="ui-hist" style="margin: 0 0 10px 0; font-size: 14px;">作品集</h4>
            <div id="gallery" class="gallery"></div>
        </div>
    </div>
</div>

<script>
let currentLang = 'ja';
const KEY = "panda_haiku_v2";
const data = {
    ja: {
        ui: { title: "パンダ俳句 β", t1: "季語を選ぶ", t2: "中句（七音）", t3: "結び（五音）", next: "次へ", done: "決定", hist: "最近の作品" },
        seasons: {
            spring: { first: ["春雷や", "花の雨", "朧月"], last: ["揺れている", "夢の中"] },
            summer: { first: ["夏雲や", "蝉しぐれ", "夕立や"], last: ["風が来る", "また明日"] },
            autumn: { first: ["秋風や", "虫の声", "新米や"], last: ["静かなり", "空高く"] },
            winter: { first: ["初霜や", "冬の星", "息白し"], last: ["春を待つ", "音もなく"] }
        },
        critiques: ["笹を食べる手を止める名作だ。", "凡庸。竹の心を知れ。", "歴史が動いた。", "ただの寝言か？"],
        talk: ["笹、食べる？", "竹の心...", "眠い..."]
    },
    fr: {
        ui: { title: "Panda Haïkaï", t1: "Kigo", t2: "Milieu", t3: "Fin", next: "Continuer", done: "Valider", hist: "Galerie" },
        seasons: {
            spring: { first: ["cerisiers,", "pluie de mars —"], last: ["un rêve.", "clarté."] },
            summer: { first: ["soleil d'été —", "cigales :"], last: ["il fait chaud.", "l'ombre."] },
            autumn: { first: ["vent d'automne :", "lune rousse —"], last: ["feuille morte.", "arrêt."] },
            winter: { first: ["brume d'hiver,", "neige blanche —"], last: ["silence.", "nouveau."] }
        },
        critiques: ["Manque de bambou.", "Élégant panda.", "Poésie de koala !", "Magnifique."],
        talk: ["Bambou ?", "Zzz...", "Poésie !"]
    },
    en: {
        ui: { title: "Panda Haiku", t1: "Kigo", t2: "Middle", t3: "End", next: "Next", done: "Done", hist: "Gallery" },
        seasons: {
            spring: { first: ["old pond,", "spring rain —"], last: ["water sound.", "a dream."] },
            summer: { first: ["summer heat —", "cicadas :"], last: ["the sun sets.", "breeze."] },
            autumn: { first: ["autumn wind :", "harvest moon —"], last: ["falling leaves.", "night."] },
            winter: { first: ["winter moon,", "first snow —"], last: ["deep silence.", "spring."] }
        },
        critiques: ["Needs bamboo.", "Elegant panda.", "Is this a joke?", "Legendary!"],
        talk: ["Bamboo?", "Nap time.", "Stay wild."]
    }
};

function setLang(l) {
    currentLang = l;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('l-'+l).classList.add('active');
    const u = data[l].ui;
    document.getElementById('ui-title').textContent = u.title;
    document.getElementById('ui-t1').textContent = u.t1;
    document.getElementById('ui-t2').textContent = u.t2;
    document.getElementById('ui-t3').textContent = u.t3;
    document.getElementById('ui-next').textContent = u.next;
    document.getElementById('ui-done').textContent = u.done;
    document.getElementById('ui-hist').textContent = u.hist;
    start();
}

function start() {
    const season = document.getElementById("seasonSelect").value;
    const area = document.getElementById("displayArea");
    if(currentLang === 'ja') {
        area.innerHTML = `<div id="l3" class="line display-ja dim">五</div><div id="l2" class="line display-ja dim">七</div><div id="l1" class="line display-ja dim">五</div>`;
    } else {
        area.innerHTML = `<div class="display-eu"><div id="l1" class="line dim">(5)</div><div id="l2" class="line dim">(7)</div><div id="l3" class="line dim">(5)</div></div>`;
    }
    showStage(1);
    const box1 = document.getElementById("opts1");
    box1.innerHTML = "";
    data[currentLang].seasons[season].first.forEach(txt => {
        const btn = document.createElement("button");
        btn.className = "opt";
        btn.innerHTML = `<span>${txt}</span> <strong>OK</strong>`;
        btn.onclick = () => { document.getElementById("l1").textContent = txt; document.getElementById("l1").classList.remove("dim"); showStage(2); };
        box1.appendChild(btn);
    });
    renderGallery();
}

function toStage3() {
    const val = document.getElementById("inputMiddle").value.trim();
    if(!val) return;
    document.getElementById("l2").textContent = val;
    document.getElementById("l2").classList.remove("dim");
    const season = document.getElementById("seasonSelect").value;
    const box3 = document.getElementById("opts3");
    box3.innerHTML = "";
    data[currentLang].seasons[season].last.forEach(txt => {
        const btn = document.createElement("button");
        btn.className = "opt";
        btn.innerHTML = `<span>${txt}</span> <strong>OK</strong>`;
        btn.onclick = () => { document.getElementById("l3").textContent = txt; document.getElementById("l3").classList.remove("dim"); finishHaiku(); };
        box3.appendChild(btn);
    });
    showStage(3);
}

function finishHaiku() {
    const val = document.getElementById("inputLast").value.trim();
    if(val) { document.getElementById("l3").textContent = val; document.getElementById("l3").classList.remove("dim"); }
    const score = Math.floor(Math.random() * 81) + 20;
    document.getElementById("resScore").textContent = score;
    const crits = data[currentLang].critiques;
    document.getElementById("resCrit").textContent = crits[Math.floor(Math.random()*crits.length)];
    showStage(4);
}

function saveAndReset() {
    const h = `${document.getElementById("l1").textContent} ${document.getElementById("l2").textContent} ${document.getElementById("l3").textContent}`;
    const list = JSON.parse(localStorage.getItem(KEY) || "[]");
    list.unshift(h);
    localStorage.setItem(KEY, JSON.stringify(list.slice(0, 20)));
    start();
}

function renderGallery() {
    const g = document.getElementById("gallery");
    const list = JSON.parse(localStorage.getItem(KEY) || "[]");
    g.innerHTML = "";
    list.forEach((text, i) => {
        const card = document.createElement("div");
        card.className = "hcard";
        card.innerHTML = text.replace(/\s/g, '<br>') + `<button class="delete-btn" onclick="deleteH(${i})">×</button>`;
        g.appendChild(card);
    });
}

function deleteH(i) {
    const list = JSON.parse(localStorage.getItem(KEY));
    list.splice(i, 1);
    localStorage.setItem(KEY, JSON.stringify(list));
    renderGallery();
}

function showStage(n) {
    for(let i=1; i<=4; i++) document.getElementById('stage'+i).classList.add('hidden');
    document.getElementById('stage'+n).classList.remove('hidden');
}

function reactPanda() {
    const b = document.getElementById("pandaTalk");
    b.textContent = data[currentLang].talk[Math.floor(Math.random()*3)];
    b.classList.add("show");
    setTimeout(() => b.classList.remove("show"), 2000);
}

setLang('ja');
</script>
</body>
</html>
