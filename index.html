<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>パンダ俳句 β</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  background: #f2f2f2;
}

.wrapper {
  max-width: 420px;
  margin: 2rem auto;
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,.12);
  padding: 1.5rem;
}

.header {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.image-box {
  width: 60px;
  height: 60px;
  border: 1px solid #ccc;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .7rem;
  color: #aaa;
}

h1 {
  font-size: 1.1rem;
  margin: 0;
}

.placeholders {
  text-align: center;
  color: #aaa;
  margin: 2rem 0 1.5rem;
  line-height: 2;
}

.placeholders .line {
  min-height: 1.6em;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: .7rem 1rem;
  margin-bottom: .8rem;
  gap: .8rem;
}

.row span {
  flex: 1;
}

.row button {
  border: 1px solid #ccc;
  background: #fff;
  border-radius: 999px;
  padding: .2rem .8rem;
  cursor: pointer;
}

.input-row {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: .6rem .8rem;
  margin: .6rem 0 1rem;
}

.input-row label {
  display: block;
  font-size: .85rem;
  color: #666;
  margin-bottom: .3rem;
}

.input-row input {
  width: 100%;
  font-size: 1rem;
  padding: .55rem .7rem;
  border: 1px solid #ddd;
  border-radius: 10px;
}

hr {
  border: none;
  border-top: 1px solid #ddd;
  margin: 1.5rem 0;
}

.history-title {
  font-weight: 600;
  margin-bottom: .8rem;
}

.history {
  display: flex;
  gap: .8rem;
}

.card {
  flex: 1;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: .6rem;
  writing-mode: vertical-rl;
  text-align: center;
  font-size: .9rem;
  min-height: 140px;
}
</style>
</head>

<body>
<div class="wrapper">

  <div class="header">
    <div class="image-box">img</div>
    <h1>パンダ俳句 β</h1>
  </div>

  <div class="placeholders">
    <div class="line" id="first">（初句）</div>
    <div class="line" id="middle">（中句）</div>
    <div class="line" id="last">（結句）</div>
  </div>

  <!-- 初句：選ぶ -->
  <div class="row">
    <span id="optFirst"></span>
    <button onclick="chooseFirst()">選ぶ</button>
  </div>

  <!-- 中句：入力 -->
  <div class="input-row">
    <label>中句（入力）</label>
    <input id="middleInput" placeholder="ここに中句を書く" oninput="syncMiddle()">
  </div>

  <!-- 結句：3候補 -->
  <div class="row">
    <span id="optLast1"></span>
    <button onclick="chooseLast(optLast1.textContent)">選ぶ</button>
  </div>
  <div class="row">
    <span id="optLast2"></span>
    <button onclick="chooseLast(optLast2.textContent)">選ぶ</button>
  </div>
  <div class="row">
    <span id="optLast3"></span>
    <button onclick="chooseLast(optLast3.textContent)">選ぶ</button>
  </div>

  <!-- 結句：入力 -->
  <div class="input-row">
    <label>結句（入力）</label>
    <input id="lastInput" placeholder="自分で結句を書く" oninput="syncLastInput()">
  </div>

  <hr>

  <div class="history-title">これまでの作品</div>
  <div class="history">
    <div class="card" id="h1"></div>
    <div class="card" id="h2"></div>
  </div>

</div>

<script>
const trad = {
  spring:["春雷や","花の雨","若葉揺れ"],
  summer:["夏雲や","蝉しぐれ","川光る"],
  autumn:["秋風や","虫の声","月高し"],
  winter:["初霜や","雪しんしん","冬の星"]
};

const ends = {
  spring:["まだ遠い","揺れている","黙ってる"],
  summer:["少し待つ","目を閉じる","風が来る"],
  autumn:["何も言わず","そのままで","歩き出す"],
  winter:["朝になる","音もなく","消えてゆく"]
};

function pick(obj){
  const ks = Object.keys(obj);
  const k = ks[Math.floor(Math.random()*ks.length)];
  const a = obj[k];
  return a[Math.floor(Math.random()*a.length)];
}

function refresh(){
  optFirst.textContent = pick(trad);
  optLast1.textContent = pick(ends);
  optLast2.textContent = pick(ends);
  optLast3.textContent = pick(ends);
}

function syncMiddle(){
  middle.textContent = middleInput.value || "（中句）";
}

function syncLastInput(){
  last.textContent = lastInput.value || "（結句）";
  trySave();
}

function chooseFirst(){
  first.textContent = optFirst.textContent;
  refresh();
  trySave();
}

function chooseLast(text){
  last.textContent = text;
  lastInput.value = "";
  refresh();
  trySave();
}

function trySave(){
  if (
    first.textContent !== "（初句）" &&
    middle.textContent !== "（中句）" &&
    last.textContent !== "（結句）"
  ) {
    h2.textContent = h1.textContent;
    h1.textContent =
      first.textContent + "　" +
      middle.textContent + "　" +
      last.textContent;
  }
}

refresh();
</script>
</body>
</html>
