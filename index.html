<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>パンダ俳句 β</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  background: #f2f2f2;
}

.wrapper {
  max-width: 420px;
  margin: 2rem auto;
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,.12);
  padding: 1.5rem;
}

.header {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.image-box {
  width: 60px;
  height: 60px;
  border: 1px solid #ccc;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .7rem;
  color: #aaa;
}

h1 {
  font-size: 1.1rem;
  margin: 0;
}

.placeholders {
  text-align: center;
  color: #aaa;
  margin: 2rem 0 1.5rem;
  line-height: 2;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: .7rem 1rem;
  margin-bottom: .8rem;
}

.row span {
  font-size: 1rem;
}

.row button {
  border: 1px solid #ccc;
  background: #fff;
  border-radius: 999px;
  padding: .2rem .8rem;
  cursor: pointer;
}

hr {
  border: none;
  border-top: 1px solid #ddd;
  margin: 1.5rem 0;
}

.history-title {
  font-weight: 600;
  margin-bottom: .8rem;
}

.history {
  display: flex;
  gap: .8rem;
}

.card {
  flex: 1;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: .6rem;
  writing-mode: vertical-rl;
  text-align: center;
  font-size: .9rem;
}
</style>
</head>

<body>
<div class="wrapper">

  <div class="header">
    <div class="image-box">img</div>
    <h1>パンダ俳句 β</h1>
  </div>

  <div class="placeholders">
    <div id="first">（初句）</div>
    <div id="middle">（中句）</div>
    <div id="last">（結句）</div>
  </div>

  <div class="row">
    <span id="opt1"></span>
    <button onclick="choose('first')">選ぶ</button>
  </div>

  <div class="row">
    <span id="opt2"></span>
    <button onclick="choose('middle')">選ぶ</button>
  </div>

  <div class="row">
    <span id="opt3"></span>
    <button onclick="choose('last')">選ぶ</button>
  </div>

  <hr>

  <div class="history-title">これまでの作品</div>
  <div class="history">
    <div class="card" id="h1"></div>
    <div class="card" id="h2"></div>
  </div>

</div>

<script>
const trad = {
  spring: ["春雷や","花の雨","若葉揺れ"],
  summer: ["夏雲や","蝉しぐれ","川光る"],
  autumn: ["秋風や","虫の声","月高し"],
  winter: ["初霜や","雪しんしん","冬の星"]
};

const modern = {
  spring: ["改札で","通知鳴る","画面越し"],
  summer: ["冷房の","白い午後","ガラス越し"],
  autumn: ["終電で","無人駅","イヤホン外す"],
  winter: ["深夜便","白い壁","息白し"]
};

const ends = {
  spring: ["まだ遠い","揺れている","黙ってる"],
  summer: ["少し待つ","目を閉じる","風が来る"],
  autumn: ["何も言わず","そのままで","歩き出す"],
  winter: ["朝になる","音もなく","消えてゆく"]
};

function pick(obj){
  const seasons = Object.keys(obj);
  const s = seasons[Math.floor(Math.random()*seasons.length)];
  const arr = obj[s];
  return arr[Math.floor(Math.random()*arr.length)];
}

function refresh(){
  opt1.textContent = pick(trad);
  opt2.textContent = pick(modern);
  opt3.textContent = pick(ends);
}

function choose(part){
  if(part==="first")  first.textContent  = opt1.textContent;
  if(part==="middle") middle.textContent = opt2.textContent;
  if(part==="last"){
    last.textContent = opt3.textContent;
    saveHistory();
  }
  refresh();
}

function saveHistory(){
  h2.textContent = h1.textContent;
  h1.textContent =
    first.textContent + "　" +
    middle.textContent + "　" +
    last.textContent;
}

refresh();
</script>
</body>
</html>
